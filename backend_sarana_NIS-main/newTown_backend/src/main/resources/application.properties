server.port=8081

# ============================================================
# JWT
# ============================================================
jwt.secret=your_super_secret_key_here_should_be_at_least_32_characters
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ============================================================
# LOGGING
# ============================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.sarana_NIS.newTown_backend=DEBUG